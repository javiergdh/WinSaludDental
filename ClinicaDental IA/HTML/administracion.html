<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | WIN SALUD DENTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        :root { 
            --verde: #558D42; 
            --verde-claro: #f0f7ee; 
            --verde-vibrante: #72b35a;
            --rojo-error: #e74c3c;
            --amarillo: #ffde59; 
            --oscuro: #1a252f; 
            --radio: 30px; 
        }

        body { font-family: 'Outfit', sans-serif; margin: 0; background-color: var(--verde-claro); padding-bottom: 120px; }
        nav { padding: 1rem 8%; display: flex; justify-content: space-between; align-items: center; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .container { padding: 40px 8%; }

        /* Agenda Header */
        .agenda-header-box { background: white; padding: 25px 40px; border-radius: var(--radio); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .agenda-info h1 { font-family: 'Bubblegum Sans', cursive; color: var(--verde); margin: 0; font-size: 2.5rem; }
        
        /* Tabla de Citas */
        .tabla-citas { background: white; border-radius: var(--radio); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .fila { display: grid; grid-template-columns: 140px 2fr 1.2fr 1.2fr 180px; padding: 25px 20px; border-bottom: 1px solid #eee; align-items: center; text-align: center; }
        .fila-header { background: var(--verde); color: white; font-weight: 800; }
        .hora-badge { background: var(--amarillo); padding: 10px; border-radius: 15px; font-weight: 800; color: var(--verde); font-size: 1.2rem; }

        /* SECCIÓN INFERIOR */
        .seccion-inferior { display: grid; grid-template-columns: 1fr 1.3fr; gap: 30px; align-items: start; }
        .panel-admin { background: white; padding: 35px; border-radius: var(--radio); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .panel-admin h2 { font-family: 'Bubblegum Sans', cursive; color: var(--verde); margin-top: 0; font-size: 2rem; margin-bottom: 25px; }

        /* FORMULARIO Y VALIDACIÓN */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } 
        .form-group label { display: block; font-weight: 800; margin-bottom: 8px; color: var(--oscuro); font-size: 0.9rem; text-transform: uppercase; }
        
        .input-container { position: relative; width: 100%; margin-bottom: 15px; }
        .input-container::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0;
            width: 8px; background-color: var(--rojo-error);
            border-radius: 15px 0 0 15px; z-index: 5; transition: 0.3s;
        }
        .input-container.valido::before { background-color: var(--verde-vibrante); }

        .form-input { 
            width: 100%; padding: 15px 15px 15px 25px; border: 2px solid #eee; 
            border-radius: 15px; font-size: 1rem; font-family: 'Outfit';
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .form-input.valido { border-color: var(--verde-vibrante); background: #fafffa; }

        .btn-accion { 
            width: 100%; padding: 18px; border: none; border-radius: 50px; font-weight: 800; 
            cursor: pointer; transition: 0.3s; font-size: 1.1rem; margin-top: 10px;
        }
        .btn-buscar { background: var(--oscuro); color: white; }
        .btn-agendar { background: var(--verde); color: white; box-shadow: 0 6px 0px var(--verde-vibrante); border: none; }

        .btn-check { background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; margin: 0 4px; }
        .btn-cancel { background: #e74c3c; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; margin: 0 4px; }
        
        /* Ajuste para las filas de resultados dentro del panel pequeño */
        .fila-busqueda {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            align-items: center;
            font-size: 0.85rem;
        }
        /* --- RESPONSIVE DESIGN: SE ADAPTA A MÓVILES --- */
        @media (max-width: 768px) {
            /* Ajuste de Navegación y Logo */
            nav {
                flex-direction: column;
                padding: 1rem 5%;
                text-align: center;
                gap: 15px;
            }
            
            .nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            /* Contenedores y Secciones */
            .container, .agenda-container, .hero {
                padding: 20px 5% !important;
                width: 100% !important;
            }

            /* Grillas: Servicios e Instalaciones (Se ponen en 1 sola columna) */
            .services-grid, .gallery-grid {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }

            /* Hero Section (Ajuste de textos) */
            .hero h1 { font-size: 2.8rem !important; }
            .hero p { font-size: 1.1rem !important; }

            /* Panel de Administración y Tablas */
            .agenda-header-box {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .tabla-container {
                overflow-x: auto; /* Permite scroll lateral si la tabla no cabe */
                border-radius: 15px;
            }

            table {
                min-width: 700px; /* Evita que los datos de la tabla se amontonen */
            }

            /* Formularios y Modales */
            .modal-content {
                width: 95% !important;
                margin: 10px auto;
                padding: 20px;
            }

            input, select, textarea, .btn-agendar {
                width: 100% !important;
                font-size: 16px !important; /* Mejora la escritura en móviles */
            }

            /* Botones flotantes (WhatsApp/Chat) */
            .chat-bubble {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-family: 'Bubblegum Sans'; font-size: 2.2rem; color: var(--verde);">WIN SALUD DENTAL</div>
        <button onclick="window.location.href='index.html'" style="background: var(--oscuro); color: white; border: none; padding: 10px 30px; border-radius: 50px; cursor: pointer; font-weight: 800;">SALIR</button>
    </nav>

    <div class="container">
        <div class="agenda-header-box">
            <div class="agenda-info">
                <h1>Agenda del Día</h1>
                <p id="fecha-actual"></p>
            </div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div style="background: var(--verde); color: white; padding: 10px 25px; border-radius: 15px; font-weight: 800;">
                    <span id="num-citas">0</span> Citas Hoy
                </div>
                <button onclick="cargarCitas()" style="background: var(--amarillo); border: none; padding: 10px; border-radius: 50%; cursor: pointer;">🔄</button>
            </div>
        </div>
        <div>
            <button onclick="exportarAgendaHoy()" style="background-color: #27ae60; color: white; padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                📥 Descargar Agenda de Hoy
            </button>
        </div>
        <div class="tabla-citas">
            <div class="fila fila-header">
                <div>HORA</div>
                <div>PACIENTE</div>
                <div>MOTIVO</div>
                <div>TELÉFONO</div>
                <div>GESTIÓN</div>
            </div>
            <div id="citas-container"></div>
        </div>

        <div class="seccion-inferior">
            
            <div class="panel-admin">
                <h2>🔎 Buscador de Citas</h2>
                
                <div class="form-group">
                    <label>Filtrar por DNI</label>
                    <div class="input-container">
                        <input type="text" id="filtro-dni" class="form-input" placeholder="DNI del Tutor" oninput="ejecutarBusqueda()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Filtrar por Día</label>
                    <div class="input-container">
                        <input type="date" id="filtro-dia" class="form-input" onchange="ejecutarBusqueda()">
                    </div>
                </div>

                <button class="btn-accion btn-buscar" onclick="limpiarBuscador()" style="margin-bottom: 20px; background: #666;">LIMPIAR FILTROS</button>

                <div id="resultados-busqueda" style="max-height: 400px; overflow-y: auto; border-top: 2px solid var(--verde-claro); padding-top: 15px;">
                    </div>
            </div>
 
            <div class="panel-admin">
                <h2>📅 Agendar Nueva Cita</h2>
                <form id="reservaForm">
                    <div class="form-group">
                        <label>Nombre del Niño/a</label>
                        <div class="input-container"><input type="text" id="f_nombre" class="form-input" placeholder="Nombre completo"></div>
                    </div>
                    <div class="form-group">
                        <label>DNI Tutor</label>
                        <div class="input-container"><input type="text" id="f_dni" class="form-input" placeholder="12345678X"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <div class="input-container"><input type="tel" id="f_tel" class="form-input" placeholder="600000000"></div>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <div class="input-container"><input type="email" id="f_email" class="form-input" placeholder="ejemplo@correo.com"></div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha</label>
                            <div class="input-container"><input type="date" id="f_dia" class="form-input" onchange="validarFecha(this)"></div>
                        </div>
                        <div class="form-group">
                            <label>Hora</label>
                            <div class="input-container"><input type="time" id="f_hora" class="form-input"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Motivo</label>
                        <div class="input-container"><input type="text" id="f_motivo" class="form-input" placeholder="Ej: Revisión..."></div>
                    </div>
                    <button type="button" class="btn-accion btn-agendar" id="btnAgendar" onclick="agendarCitaAdmin()">✨ REGISTRAR CITA</button>
                </form>
            </div>

        </div>
    </div>
<script>
    const API_URL = "https://api-production-0da0.up.railway.app";
    const FESTIVOS = ["2026-01-01", "2026-01-06", "2026-05-01", "2026-10-12", "2026-12-25"];

    window.onload = () => {
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('f_dia').setAttribute('min', hoy);
        
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => validarInputRealTime(input));
        });

        cargarCitas();
    };

    // --- VALIDACIÓN ---
    function validarInputRealTime(input) {
        let esValido = false;
        const valor = input.value.trim();
        const contenedor = input.parentElement;

        switch (input.id) {
            case 'f_nombre': case 'f_motivo': esValido = valor.length >= 3; break;
            case 'f_dni': case 'filtro-dni': esValido = /^[0-9]{8}[TRWAGMYFPDXBNJZSQVHLCKE]$/i.test(valor); break;
            case 'f_tel': esValido = /^\d{9}$/.test(valor); break;
            case 'f_email': esValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor); break;
            case 'f_dia': esValido = valor !== ""; break;
            case 'f_hora': esValido = checkRestriccionesHora(valor); break;
            default: esValido = valor !== "";
        }

        if (esValido && contenedor && contenedor.classList.contains('input-container')) { 
            contenedor.classList.add('valido'); 
            input.classList.add('valido'); 
        } else if (contenedor && contenedor.classList.contains('input-container')) { 
            contenedor.classList.remove('valido'); 
            input.classList.remove('valido'); 
        }
        return esValido;
    }

    function checkRestriccionesHora(horaStr) {
        if (!horaStr) return false;
        const [horas, minutos] = horaStr.split(':').map(Number);
        if (minutos !== 0 && minutos !== 30) return false;
        return ((horas >= 10 && horas < 14) || (horas >= 16 && horas < 20));
    }

    function validarFecha(input) {
        const fecha = new Date(input.value);
        const diaSemana = fecha.getUTCDay(); 
        if (diaSemana === 0 || diaSemana === 6 || FESTIVOS.includes(input.value)) {
            alert("La clínica está cerrada los fines de semana y festivos.");
            input.value = "";
            input.parentElement.classList.remove('valido');
        } else { 
            validarInputRealTime(input); 
        }
    }

    // --- CARGAR CITAS DEL DÍA (TABLA SUPERIOR) ---
    async function cargarCitas() {
        const hoy = new Date();
        const y = hoy.getFullYear();
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        const d = String(hoy.getDate()).padStart(2, '0');
        const hoyStr = `${y}-${m}-${d}`;

        document.getElementById('fecha-actual').innerText = hoy.toLocaleDateString('es-ES', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        try {
            const res = await fetch(`${API_URL}/consultar-todas-las-citas`);
            const citas = await res.json();
            const citasHoy = citas.filter(c => (c.fecha || c.Fecha) === hoyStr);

            document.getElementById('num-citas').innerText = citasHoy.length;
            renderizarCitas(citasHoy, 'citas-container');
        } catch (e) { console.error(e); }
    }

    // --- BUSCADOR UNIFICADO (DNI + DÍA) ---
    async function ejecutarBusqueda() {
        const filtroDni = document.getElementById('filtro-dni').value.toLowerCase().trim();
        const filtroDia = document.getElementById('filtro-dia').value;
        const container = document.getElementById('resultados-busqueda');

        if (!filtroDni && !filtroDia) {
            container.innerHTML = "";
            return;
        }

        try {
            const res = await fetch(`${API_URL}/consultar-todas-las-citas`);
            const citas = await res.json();

            const resultados = citas.filter(c => {
                const coincideDni = filtroDni ? c.dni.toLowerCase().includes(filtroDni) : true;
                const coincideDia = filtroDia ? (c.fecha || c.Fecha) === filtroDia : true;
                return coincideDni && coincideDia;
            });

            if (resultados.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#999; font-size:0.9rem'>Sin resultados</p>";
            } else {
                container.innerHTML = "";
                resultados.forEach(cita => {
                    const fila = document.createElement('div');
                    fila.className = 'fila-busqueda';
                    const estado = cita.estado || "Pendiente";
                    
                    // Color de fondo ligero según estado
                    let bg = "transparent";
                    if(estado === 'Completada') bg = "#e8f5e9";
                    if(estado === 'No Asistió') bg = "#ffebee";

                    fila.style.backgroundColor = bg;

                    fila.innerHTML = `
                        <div style="font-weight:800">${cita.horario}<br><small>${cita.fecha}</small></div>
                        <div><b>${cita.nombre}</b><br><small>${cita.motivo}</small></div>
                        <div style="display:flex; gap:5px; justify-content:center">
                            <button class="btn-check" onclick="gestionarCita(${cita.id}, 'Completada')" style="padding:5px; font-size:0.7rem">✓</button>
                            <button class="btn-cancel" onclick="gestionarCita(${cita.id}, 'No Asistió')" style="padding:5px; font-size:0.7rem">✕</button>
                        </div>`;
                    container.appendChild(fila);
                });
            }
        } catch (e) { console.error(e); }
    }

    function limpiarBuscador() {
        document.getElementById('filtro-dni').value = "";
        document.getElementById('filtro-dia').value = "";
        document.getElementById('resultados-busqueda').innerHTML = "";
    }

    // --- RENDERIZADO DE TABLA PRINCIPAL ---
    function renderizarCitas(citas, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        
        citas.sort((a, b) => (a.horario || "") > (b.horario || "") ? 1 : -1);

        if(citas.length === 0) {
            container.innerHTML = "<div style='padding:40px; text-align:center; color:#999;'>No hay citas.</div>";
            return;
        }

        citas.forEach(cita => {
            const fila = document.createElement('div');
            fila.className = 'fila';
            const estado = cita.estado || "Pendiente";
            
            if (estado === 'Completada') { fila.style.backgroundColor = "#e8f5e9"; fila.style.borderLeft = "5px solid #4caf50"; }
            else if (estado === 'No Asistió') { fila.style.backgroundColor = "#ffebee"; fila.style.borderLeft = "5px solid #f44336"; }

            fila.innerHTML = `
                <div><span class="hora-badge">${cita.horario}</span></div>
                <div><b>${cita.nombre}</b><br><small>DNI: ${cita.dni}</small></div>
                <div>${cita.motivo}</div>
                <div style="font-weight:800; color:var(--verde)">${cita.telefono}</div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <div style="display:flex; gap:10px;">
                        <button class="btn-check" onclick="gestionarCita(${cita.id}, 'Completada')" style="width:35px; height:35px; border-radius:50%">✓</button>
                        <button class="btn-cancel" onclick="gestionarCita(${cita.id}, 'No Asistió')" style="width:35px; height:35px; border-radius:50%">✕</button>
                    </div>
                    <small style="font-weight:800; font-size:0.65rem; color:#666;">${estado.toUpperCase()}</small>
                </div>`;
            container.appendChild(fila);
        });
    }

    // --- GESTIÓN DE ESTADOS (API) ---
    async function gestionarCita(id, nuevoEstado) {
        try {
            const res = await fetch(`${API_URL}/gestionar-cita-admin?citaId=${id}&nuevoEstado=${nuevoEstado}`, { method: 'POST' });
            if (res.ok) { 
                cargarCitas(); 
                ejecutarBusqueda(); // Actualizar también la lista del buscador si está abierta
            }
        } catch (e) { alert("Error de conexión"); }
    }

    // --- AGENDAR DESDE ADMIN ---
    async function agendarCitaAdmin() {
        const campos = document.querySelectorAll('#reservaForm .form-input');
        const todosValidos = Array.from(campos).every(c => validarInputRealTime(c));
        const btn = document.getElementById('btnAgendar');

        if(!todosValidos) { alert("Rellene los campos correctamente."); return; }

        const datos = {
            Nombre: document.getElementById('f_nombre').value,
            Dni: document.getElementById('f_dni').value,
            Telefono: document.getElementById('f_tel').value,
            Email: document.getElementById('f_email').value,
            Dia: document.getElementById('f_dia').value,
            Horario: document.getElementById('f_hora').value,
            Motivo: document.getElementById('f_motivo').value,
            Estado: "Pendiente"
        };

        try {
            btn.innerText = "REGISTRANDO..."; btn.disabled = true;
            const res = await fetch(`${API_URL}/agendar-cita`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if(res.ok) { 
                alert("Cita registrada");
                document.getElementById('reservaForm').reset();
                campos.forEach(c => { c.classList.remove('valido'); c.parentElement.classList.remove('valido'); });
                cargarCitas();
            }
        } catch (e) { alert("Error de conexión"); }
        finally { btn.innerText = "✨ REGISTRAR CITA"; btn.disabled = false; }
    }
    async function exportarAgendaHoy() {
        try {
            // 1. Obtenemos la fecha de hoy en formato YYYY-MM-DD
            const hoy = new Date().toISOString().split('T')[0];
            
            // 2. Llamamos a tu API usando el nombre REAL de tu endpoint
            // Cambiamos /obtener-citas por /consultar-todas-las-citas
            const res = await fetch(`${API_URL}/consultar-todas-las-citas`);
            
            if (!res.ok) throw new Error("No se pudieron obtener las citas");
            
            const todasLasCitas = await res.json();

            // 3. Filtramos solo las que son de hoy
            // Importante: tu API devuelve 'fecha' en minúscula
            const citasHoy = todasLasCitas.filter(c => c.fecha === hoy);

            if (citasHoy.length === 0) {
                alert("No hay citas registradas para hoy (" + hoy + ") en la base de datos.");
                return;
            }

            // 4. Creamos el CSV
            let csvContent = "\uFEFF"; // BOM para acentos
            csvContent += "Horario,Paciente,DNI,Teléfono,Email,Motivo,Estado\n";

            citasHoy.forEach(c => {
                // Usamos los nombres de campos que devuelve tu API (nombre, dni, telefono, etc.)
                csvContent += `"${c.horario}","${c.nombre}","${c.dni}","${c.telefono}","${c.email}","${c.motivo}","${c.estado}"\n`;
            });

            // 5. Descarga
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Agenda_Hoy_${hoy}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        } catch (error) {
            console.error("Error al exportar:", error);
            alert("Error al conectar con la API. Asegúrate de que los servicios están activos.");
        }
    }
</script>
</body>
</html>
